# develop/main 푸시와 PR 마다 pytest 를 돌린다. 실패하면 PR 에 빨간 X 가 뜬다.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Dockerfile 과 같은 버전
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    # Dockerfile 이 실제로 빌드·기동되는지 확인 (컨테이너를 띄우고 /health 응답까지 본다)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t px-ai .
      - run: docker run -d --name px-ai -p 8001:8001 px-ai
      - run: |
          for i in $(seq 1 30); do
            curl -sf localhost:8001/api/v1/health && exit 0
            sleep 1
          done
          docker logs px-ai
          exit 1
